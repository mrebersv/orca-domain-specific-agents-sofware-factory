[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-stack"
version = "0.1.0"
description = "Local-First Multi-Agent Architecture, Knowledge Engine & Orca ADE Integration"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Local Agent Stack Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "mcp>=1.0.0",
    "aiosqlite>=0.20.0",
    "docstring-parser>=0.16",
    "tree-sitter>=0.22.0",
    "pydantic>=2.8.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-json-report>=1.5.0",
]

[project.scripts]
forge = "agent_forge.cli:main"
vram-proxy = "proxy.vram_arbiter:main"
mcp-docs-db = "mcp_server.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_forge*", "mcp_server*", "adapters*", "proxy*", "orca_pack*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
