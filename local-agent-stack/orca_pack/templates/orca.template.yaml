# Orca ADE Workspace Configuration
# Generated by `forge init-orca` — do not edit manually unless you know what you're doing.
# This file registers MCP servers, model endpoints, agent nodes, and lifecycle hooks.

mcp_servers:
  docs-db:
    command: "mcp-docs-db"
    args: ["--db-path", "${WORKSPACE_ROOT}/.agent/docs.db"]
    transport: "stdio"

models:
  local-slm:
    base_url: "http://127.0.0.1:8000/v1"
    api_key: "not-needed"
    model: "{{ local_model_name }}"
  cloud-fallback:
    base_url: "https://api.anthropic.com/v1"
    api_key: "${ANTHROPIC_API_KEY}"
    model: "claude-3-5-sonnet-latest"

nodes:
  test-author-node:
    agent_id: "test-author"
    worktree: true
    model: "local-slm"
    description: "Dispatches Phase Test Author Agent in read-only worktree"
  builder-node:
    agent_id: "builder"
    worktree: true
    model: "local-slm"
    description: "Dispatches Task Builder Agent in task-specific worktree"
  gatekeeper-node:
    agent_id: "gatekeeper"
    worktree: true
    model: "local-slm"
    description: "Executes pytest gate check with JSON report"
  remediation-node:
    agent_id: "remediation"
    worktree: true
    model: "local-slm"
    description: "Dispatches remediation agent with failure payload"

hooks:
  pre_node_hook: "python -m orca_pack.hooks.pre_run"
  post_node_hook: "python -m orca_pack.hooks.post_run"
